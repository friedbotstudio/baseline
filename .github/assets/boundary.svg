<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="boundary-title boundary-desc">
  <title id="boundary-title">The tool boundary</title>
  <desc id="boundary-desc">Claude's domain sits above a dashed boundary line. Tools and the filesystem sit below it. Hooks fire on the boundary itself, outside Claude's reach, and the consent marker lives there too.</desc>

  <!-- Self-contained background: GitHub renders READMEs in both light and dark
       themes and strips external CSS, so every colour is a literal here and the
       plate carries its own surface. Values are the DESIGN.md tokens converted
       from oklch: ink #0b0b0b, bg #f3f3f3, paper #fcfcfc, accent #c83e00,
       muted #4c5664. -->
  <rect width="720" height="300" rx="10" fill="#f3f3f3"/>

  <!-- Above the boundary: filled ink, Claude's domain. -->
  <rect x="60" y="38" width="600" height="76" rx="6" fill="#0b0b0b"/>
  <text x="360" y="84" text-anchor="middle" fill="#fcfcfc"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="24" font-weight="700" letter-spacing="2">CLAUDE</text>

  <!-- The boundary: dashed accent rule. -->
  <line x1="30" y1="150" x2="690" y2="150" stroke="#c83e00" stroke-width="2"
        stroke-dasharray="6 5" stroke-linecap="round"/>

  <!-- Hooks firing on the boundary. -->
  <g stroke="#c83e00" stroke-width="1.75" stroke-linecap="round">
    <line x1="140" y1="140" x2="140" y2="160"/>
    <line x1="290" y1="140" x2="290" y2="160"/>
    <line x1="430" y1="140" x2="430" y2="160"/>
    <line x1="580" y1="140" x2="580" y2="160"/>
  </g>

  <!-- Consent marker: lives ON the boundary, structurally outside Claude's reach. -->
  <circle cx="215" cy="150" r="5.5" fill="#c83e00" stroke="#f3f3f3" stroke-width="2" paint-order="stroke fill"/>

  <!-- Zone tags. Text is pre-uppercased; text-transform is CSS and does not survive. -->
  <text x="30" y="136" text-anchor="start" fill="#4c5664"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" font-weight="600" letter-spacing="1.3">INSIDE · CLAUDE'S REACH</text>
  <text x="690" y="176" text-anchor="end" fill="#4c5664"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" font-weight="600" letter-spacing="1.3">OUTSIDE · HOOKS FIRE HERE</text>

  <!-- Below the boundary: stroked plate, the tool and filesystem domain. -->
  <rect x="60" y="186" width="600" height="76" rx="6" fill="#fcfcfc" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="360" y="232" text-anchor="middle" fill="#0b0b0b"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="24" font-weight="700" letter-spacing="2">TOOL</text>
</svg>
