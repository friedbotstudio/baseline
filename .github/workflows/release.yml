# Push-driven release pipeline for `@friedbotstudio/create-baseline`.
#
# Trigger: push (or merged PR) to main or next, OR workflow_dispatch with
# mode=docs-only for a Pages-only redeploy. Bump type, changelog, git tag,
# GitHub Release, and PR comments are all driven by semantic-release from
# conventional commits.
#
# Architecture: three jobs.
#   pre-publish-checks — runs `npm run publish:check` (precheck dry-run +
#                        files-diff + smoke-tarball). Pre-publish gate. If
#                        any check fails, the release job does NOT run, so
#                        no broken tarball reaches npm.
#   release            — needs: pre-publish-checks. Runs semantic-release;
#                        publishes to npm (latest on main, next prerelease
#                        on next), creates GH Release, comments on closed
#                        PRs, commits CHANGELOG.md + package.json back, tags
#                        vX.Y.Z. Skipped on workflow_dispatch docs-only.
#   deploy-pages       — needs: release. main branch only. Builds obj/site
#                        against post-release HEAD; deploys Pages. Runs on
#                        every main push (whether or not a release fired)
#                        so site-src/ changes always reach the live site.
#
# Why no post-publish install-smoke job: pre-publish-checks runs the same
# install-smoke logic against the locally-packed tarball BEFORE npm publish,
# so a broken package never ships. Once `npm publish` returns success, the
# upload is on the registry; we don't need a follow-up confirmation job.
#
# Runbook: docs/runbooks/npm-publish.md (manual fallback + branch-protection
# migration callout) + docs/specs/release-workflow.md.
#
# Action SHA verification (verify-action-shas.mjs runs as the first content
# step of pre-publish-checks, so a drifted SHA fails fast before any other
# work):
#   Every third-party action is pinned to a 40-char SHA with tag in trailing
#   comment per CLAUDE.md Art VII + runbook §Future-CI invariants Rule 1.
#   Re-resolve via `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and
#   update if drift is detected. Tag refs are mutable — never relax to `@vX`.

name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      mode:
        description: 'docs-only = redeploy GitHub Pages without cutting a release. The auto-flow handles releases on push to main / next.'
        type: choice
        required: true
        default: docs-only
        options:
          - docs-only

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  pre-publish-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: site-updated-date-truth.test.mjs walks each page's commit
          # log to find the last commit that changed its CONTENT (not just its date
          # line). Under the default depth-1 checkout every page reports the push
          # commit as its last edit, so every page looks staler than its frontmatter.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify pinned action SHAs match upstream tags
        run: node scripts/verify-action-shas.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify provenance + signatures of installed dependencies
        run: npm audit signatures
      # Ordered before publish:check so the cheap failure comes first: the suite is
      # the long pole, but a pack + install + smoke run costs more than re-running it.
      # `release` declares `needs: pre-publish-checks`, so a red suite fails this job
      # and the publish never starts. That gates the RELEASE; branch protection gates
      # merges, and is not involved.
      # The suite reads the SHIPPED template (obj/template/) — it is gitignored
      # build output, so a fresh checkout has none and those tests die on ENOENT.
      # `npm ci` runs `prepare`, not `prepack`, so nothing builds it implicitly.
      - name: Build the shipped template
        run: npm run build
      # Four test files read the RENDERED docs site (obj/site/**) to check that
      # every hook, track and nav link a page claims to list is actually on it.
      # obj/ is gitignored build output, so a fresh checkout has none and those
      # tests die on ENOENT. deploy-pages builds the site too, but that job runs
      # after release — far too late to gate anything.
      - name: Build the docs site
        run: npm run build:site
      - name: Run the test suite
        run: npm test
      - name: Pre-publish checks (precheck + files-diff + smoke-tarball)
        run: npm run publish:check

  release:
    needs: pre-publish-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - id: semantic_release
        name: Run semantic-release
        if: inputs.mode != 'docs-only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  deploy-pages:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify Pages build_type is workflow
        # Fail-fast preflight: deploy-pages silently no-ops if the repo's Pages
        # build_type is not 'workflow' (the 2026-05-14 origin bug). Catch it here
        # with an actionable message instead of a silent wrong deploy.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo "")
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages build_type is '${build_type:-unset}', expected 'workflow'. Fix it with: gh api -X PUT repos/${{ github.repository }}/pages -f build_type=workflow"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build docs site
        run: npm run build:site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: obj/site
      - id: deployment
        name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
