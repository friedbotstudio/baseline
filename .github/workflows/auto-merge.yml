# Auto-merge for provably low-risk PRs (baseline CI posture, slice J1).
#
# Two jobs:
#   pre-publish-checks — mirrors release.yml's gate job under the SAME check
#                        name. release.yml triggers on push only, so without
#                        this PR-context twin the branch-protection required
#                        context "pre-publish-checks" could never report on a
#                        PR head and no PR could ever merge.
#   classify-and-enable — runs scripts/ci/low-risk-classifier.mjs over the PR's
#                        changed paths. Only a diff that is entirely prose
#                        surfaces (docs/**, site-src/**, README.md) and hits
#                        nothing on the NEVER-list gets auto-merge enabled via
#                        `gh pr merge --auto` — the merge itself still waits
#                        for the required checks to go green.
#
# Changed paths flow via stdin (--stdin) so filenames never touch the shell.
# Action SHAs are pinned per the npm-publish runbook Rule 1 (same pins as
# release.yml; verify-action-shas.mjs re-validates them).

name: Auto-merge low-risk PRs

on:
  pull_request:
    branches: [main, next]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pre-publish-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Verify pinned action SHAs match upstream tags
        run: node scripts/verify-action-shas.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify provenance + signatures of installed dependencies
        run: npm audit signatures
      - name: Pre-publish checks (precheck + files-diff + smoke-tarball)
        run: npm run publish:check

  classify-and-enable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Classify PR diff
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR_NUMBER" --name-only \
            | node scripts/ci/low-risk-classifier.mjs --stdin; then
            echo "low_risk=true" >> "$GITHUB_OUTPUT"
          else
            echo "low_risk=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enable auto-merge (low-risk only)
        if: steps.classify.outputs.low_risk == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
